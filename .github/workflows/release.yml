name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - name: Setup rust-lld
        run: |
          RUST_SYSROOT=$(rustc --print sysroot)
          RUST_LLD="$RUST_SYSROOT/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$RUST_LLD" > ~/.cargo/bin/rust-lld
          chmod +x ~/.cargo/bin/rust-lld

      - name: Build all architectures
        run: bash scripts/build-all.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true